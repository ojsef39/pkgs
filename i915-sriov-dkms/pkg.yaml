name: i915-sriov-dkms-pkg
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
  - stage: kernel-build
steps:
  - sources:
      - url: https://github.com/strongtz/i915-sriov-dkms/archive/refs/tags/2025.07.22.tar.gz
        destination: i915-sriov-dkms.tar.gz
        sha256: b25be72732521aff5b8feb643cc363f7d0f582124e5efb227dc906fa264bf4b0
        sha512: 2f630a44039a1b8d7755ff41b15e290206cfaca3e0f9c4c5280d927862f5941b63dcfc182eccc7cf5cf9962798edc48c8bec5b25b384c7bacfcf849db7e6dcc1
    env:
      ARCH: {{ if eq .ARCH "aarch64"}}arm64{{ else if eq .ARCH "x86_64" }}x86_64{{ else }}unsupported{{ end }}
    prepare:
      - |
        tar xf i915-sriov-dkms.tar.gz --strip-components=1
    build:
      - |
        # Configure the build for the current kernel
        ./configure
        # Only build i915 module, skip kvmgt since Talos doesn't have KVM
        sed -i '/obj-m += kvmgt\.o/d' Makefile
        # Build only the i915 SRIOV module
        make -C /src M=$(pwd) i915.ko
    install:
      - |
        KERNEL_RELEASE=$(cat /src/include/config/kernel.release)
        mkdir -p /rootfs/usr/lib/modules/${KERNEL_RELEASE}/extras/
        # Install our built i915.ko module
        cp i915.ko /rootfs/usr/lib/modules/${KERNEL_RELEASE}/extras/
    test:
      - |
        # https://www.kernel.org/doc/html/v4.15/admin-guide/module-signing.html#signed-modules-and-stripping
        find /rootfs/usr/lib/modules -name '*.ko' -exec grep -FL '~Module signature appended~' {} \+
      - |
        fhs-validator /rootfs
finalize:
  - from: /rootfs
    to: /
